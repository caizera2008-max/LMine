name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Localizar projeto (descompacta se enviado como zip)
        run: |
          if [ -f MinecraftLista.zip ]; then
            unzip -o MinecraftLista.zip -d _proj
            echo "DIR=_proj/MinecraftLista" >> $GITHUB_ENV
          else
            echo "DIR=." >> $GITHUB_ENV
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/app-debug.apk
          
